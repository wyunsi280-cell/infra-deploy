services:
  devpi:
    build: .
    environment:
      - DEVPI_OUTSIDE_URL=${DEVPI_OUTSIDE_URL:-}
      - DEVPI_PASSWORD=${DEVPI_PASSWORD:-}
    volumes:
      - devpi-data:/data
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    ports:
      - "3141:3141"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped
    depends_on:
      - devpi
    networks:
      - internal

volumes:
  devpi-data:
  caddy-data:

networks:
  internal:
